name: Bug report
description: Something does not work as expected.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not post stream keys, tokens, recordings or real chat logs. Redact diagnostics first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin version, OBS Studio version and operating system
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      render: text
