name: Dependency review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Needs a public repository on the free plan. A skipped job counts as passing in the merge queue.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Keep in step with deny.toml.
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, GPL-2.0-or-later, ISC, LGPL-2.1-or-later, MIT, MPL-2.0, Unicode-3.0, Unlicense, Zlib
